plugins { id 'java' }
group = 'com.divinitysmp'
version = '0.1.0-dev'
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2-R0.1-SNAPSHOT'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.0'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(26) } }
